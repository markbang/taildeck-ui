# Compares the launcher icon of this build with the Kotlin app's v0.1.0 APK:
# same resources (aapt2 diff) and the same icon as drawn by the Android
# launcher (emulator screenshots, montage).
name: icon-compare

on:
  workflow_dispatch:
    inputs:
      flutter-apk-url:
        description: Flutter APK to check (empty builds one from this ref)
        type: string
        default: ''
      kotlin-apk-url:
        description: Kotlin reference APK
        type: string
        default: https://github.com/markbang/taildeck/releases/download/v0.1.0/taildeck-0.1.0-x86_64.apk
  pull_request:
    paths:
      - 'android/app/src/main/res/**'
      - 'tool/gen_icons.py'
      - 'tool/icon_shots.sh'
      - 'tool/compare_apk_icons.py'
      - '.github/workflows/icon-compare.yml'

permissions:
  contents: read

concurrency:
  group: icon-compare-${{ github.ref }}
  cancel-in-progress: true

env:
  GOPROXY: https://proxy.golang.org,direct
  GOTOOLCHAIN: auto
  KOTLIN_APK_URL: ${{ inputs.kotlin-apk-url || 'https://github.com/markbang/taildeck/releases/download/v0.1.0/taildeck-0.1.0-x86_64.apk' }}
  APP_ID: top.bangwu.taildeck

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        if: ${{ !inputs.flutter-apk-url }}
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-go@v6
        if: ${{ !inputs.flutter-apk-url }}
        with:
          go-version: 1.27.x
          cache-dependency-path: native/bridge/go.sum
      - uses: mlugg/setup-zig@v2
        if: ${{ !inputs.flutter-apk-url }}
        with:
          version: 0.17.1
      - name: Pin the Android NDK
        if: ${{ !inputs.flutter-apk-url }}
        run: |
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          ndk="$sdk/ndk/28.2.13676358"
          if [ ! -d "$ndk" ]; then
            sdkmanager_bin="$(ls "$sdk"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
            yes | "$sdkmanager_bin" --licenses > /dev/null 2>&1 || true
            "$sdkmanager_bin" --install "ndk;28.2.13676358"
          fi
          test -d "$ndk"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        if: ${{ !inputs.flutter-apk-url }}
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - name: Build the native libs (x86_64)
        if: ${{ !inputs.flutter-apk-url }}
        run: |
          set -o pipefail
          flutter pub get
          tool/build_native.sh android-x86_64 | tee /tmp/build_native.log
          tool/build_term.sh android-x86_64 | tee /tmp/build_term.log
      - name: Configure Android signing
        if: ${{ !inputs.flutter-apk-url }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          umask 077
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          {
            echo "storeFile=release.jks"
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > android/key.properties
          chmod 600 android/app/release.jks android/key.properties
      - name: Build the release APK (x86_64)
        if: ${{ !inputs.flutter-apk-url }}
        run: |
          flutter build apk --release --target-platform android-x64 --split-per-abi
          mkdir -p build
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk build/flutter.apk
      - name: Drop the signing material
        if: always()
        run: rm -f android/app/release.jks android/key.properties
      - name: Download the APKs
        run: |
          mkdir -p build
          if [ -n "${{ inputs.flutter-apk-url }}" ]; then
            curl -fsSL -o build/flutter.apk "${{ inputs.flutter-apk-url }}"
          fi
          curl -fsSL -o build/kotlin.apk "$KOTLIN_APK_URL"
          test -s build/flutter.apk

      - name: Compare the icon resources
        run: |
          set -o pipefail
          python3 tool/compare_apk_icons.py build/kotlin.apk build/flutter.apk | tee build/icon-resources.txt
          {
            echo '### Launcher icon resources'
            echo
            echo '```'
            cat build/icon-resources.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install ImageMagick
        run: |
          if ! command -v montage > /dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq imagemagick fonts-dejavu-core
          fi

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: tool/icon_shots.sh build/kotlin.apk build/flutter.apk build/icons

      - name: Job summary
        if: always()
        run: |
          {
            echo '### Launcher icon on the emulator'
            echo
            echo '```'
            cat build/icons/summary.txt 2>/dev/null || echo 'no summary'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: icon-compare
          path: build/icons/
          if-no-files-found: warn
