# Records a UI change on the emulator, on release builds of main and of the
# dispatched ref: the recorder script gets both APKs and an output directory.
# Evidence on demand only (workflow_dispatch); it never runs on a PR. Record
# mode: a miss is reported in the summary and the artifact, never as a failed
# run.
name: ui-record

on:
  workflow_dispatch:
    inputs:
      recorder:
        description: Recorder script, run as <script> <after.apk> <before.apk> <out>
        default: tool/row_press_record.sh
      out:
        description: Output directory and artifact name
        default: row-press
      base:
        description: Ref or commit the "before" APK is built from
        default: main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOPROXY: https://proxy.golang.org,direct
  GOTOOLCHAIN: auto

jobs:
  record:
    name: ${{ inputs.out }} on the emulator, before and after
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-go@v6
        with:
          go-version-file: native/bridge/go.mod
          cache-dependency-path: native/bridge/go.sum
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Pin the Android NDK
        continue-on-error: true
        run: |
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          ndk="$sdk/ndk/28.2.13676358"
          if [ ! -d "$ndk" ]; then
            sdkmanager_bin="$(ls "$sdk"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
            yes | "$sdkmanager_bin" --licenses > /dev/null 2>&1 || true
            "$sdkmanager_bin" --install "ndk;28.2.13676358"
          fi
          test -d "$ndk"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - name: Build the native libs (x86_64)
        continue-on-error: true
        run: |
          set -o pipefail
          flutter pub get
          tool/build_native.sh android-x86_64 | tee /tmp/build_native.log
          tool/build_term.sh android-x86_64 | tee /tmp/build_term.log
      - name: Configure Android signing
        continue-on-error: true
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is empty; the release build needs the keystore (see docs/SIGNING.md)"
              exit 1
            fi
          done
          umask 077
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          {
            echo "storeFile=release.jks"
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > android/key.properties
          chmod 600 android/app/release.jks android/key.properties
      - name: Build the release APKs, after and before
        continue-on-error: true
        # The demo flag only fills the preview pages; these APKs are evidence,
        # never shipped.
        env:
          BASE: ${{ inputs.base }}
        run: |
          set -o pipefail
          build() {
            flutter build apk --release --target-platform android-x64 \
              --split-per-abi --dart-define=TAILDECK_DEMO=true
            cp build/app/outputs/flutter-apk/app-x86_64-release.apk "build/$1.apk"
          }
          build ui-after
          git fetch --no-tags --depth=1 origin "$BASE"
          git checkout FETCH_HEAD -- lib third_party
          build ui-before
          git checkout HEAD -- lib third_party
          ls -l build/ui-after.apk build/ui-before.apk
      - name: Drop the signing material
        if: always()
        run: rm -f android/app/release.jks android/key.properties
      - name: Install the recording tools
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg imagemagick fonts-dejavu-core
      - name: Enable KVM
        continue-on-error: true
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 30
        continue-on-error: true
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash "${{ inputs.recorder }}" build/ui-after.apk build/ui-before.apk "${{ inputs.out }}"
      - name: Job summary
        if: always()
        env:
          OUT: ${{ inputs.out }}
        run: |
          {
            echo "### $OUT on the emulator"
            echo
            echo '```'
            cat "$OUT/summary.txt" 2>/dev/null || echo 'no summary'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.out }}
          path: ${{ inputs.out }}/
          if-no-files-found: warn
