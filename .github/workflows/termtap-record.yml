# The terminal-sheet gate: on the emulator, against a real SSH shell from the
# runner's test tailnet, a tap on the grid must leave the IME down and only
# reach a mouse-tracking program as an SGR 1006 left press and release; the
# toolbar's keyboard button must show and hide the IME; typing and Compose must
# reach the shell. The gate fails the run; the vim and htop clips and the
# before/after sheet takes are recorded next to it.
name: termtap-record

on:
  workflow_dispatch:
  # Temporary: dispatch only reaches a workflow that is on the default branch.
  push:
    branches: [feat/terminal-sheet-ui]

permissions:
  contents: read

concurrency:
  group: termtap-record-${{ github.ref }}
  cancel-in-progress: true

env:
  GOPROXY: https://proxy.golang.org,direct
  GOTOOLCHAIN: auto

jobs:
  gate:
    name: tap focus, keyboard and mouse reports on the emulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.x
          cache-dependency-path: native/bridge/go.sum
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Pin the Android NDK
        run: |
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          ndk="$sdk/ndk/28.2.13676358"
          if [ ! -d "$ndk" ]; then
            sdkmanager_bin="$(ls "$sdk"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
            yes | "$sdkmanager_bin" --licenses > /dev/null 2>&1 || true
            "$sdkmanager_bin" --install "ndk;28.2.13676358"
          fi
          test -d "$ndk"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build the native libs (x86_64)
        run: |
          set -o pipefail
          tool/build_native.sh android-x86_64 | tee /tmp/build_native.log
          tool/build_term.sh android-x86_64 | tee /tmp/build_term.log
      - name: Build a profile APK (x86_64)
        run: |
          flutter build apk --profile --target-platform android-x64
          cp build/app/outputs/flutter-apk/app-profile.apk build/termtap.apk
      - name: Start a test control plane
        id: control
        run: |
          set -o pipefail
          (cd tool/motion && go build -o /tmp/motion_control ./control) 2>&1 | tee /tmp/control-build.log
          /tmp/motion_control -addr 127.0.0.1:8080 > /tmp/control.log 2>&1 &
          for _ in $(seq 1 20); do
            grep -q 'listening on' /tmp/control.log && break
            sleep 1
          done
          if grep -q 'listening on 127.0.0.1:8080' /tmp/control.log; then
            echo "control_url=http://10.0.2.2:8080" >> "$GITHUB_OUTPUT"
            echo "auth_key=tskey-test" >> "$GITHUB_OUTPUT"
            derp=$(sed -n 's/.*DERP httpsrv listener: 127\.0\.0\.1:\([0-9]*\).*/\1/p' /tmp/control.log | head -1)
            echo "derp_port=$derp" >> "$GITHUB_OUTPUT"
          else
            echo "control server did not listen; see /tmp/control.log" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Start a peer with an SSH shell
        id: peer
        run: |
          if [ -z "${{ steps.control.outputs.control_url }}" ]; then
            echo "peer=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set -o pipefail
          (cd tool/motion && go build -o /tmp/motion_peer ./peer) 2>&1 | tee /tmp/peer-build.log
          /tmp/motion_peer -control http://127.0.0.1:8080 -hostname motionpeer -port 3000 -ssh-port 22 > /tmp/peer.log 2>&1 &
          for _ in $(seq 1 60); do
            grep -q 'serving on' /tmp/peer.log && break
            sleep 1
          done
          grep 'ssh shell' /tmp/peer.log || echo 'the peer did not come up; see /tmp/peer.log'
      - name: Install the recording tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg imagemagick fonts-dejavu-core vim htop
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: >-
            CONTROL_URL='${{ steps.control.outputs.control_url }}'
            AUTH_KEY='${{ steps.control.outputs.auth_key }}'
            DERP_PORT='${{ steps.control.outputs.derp_port }}'
            bash -c 'adb reverse "tcp:$DERP_PORT" "tcp:$DERP_PORT" >/dev/null 2>&1 || true;
            status=0;
            tool/termtap_record.sh build/termtap.apk top.bangwu.taildeck termtap || status=1;
            curl -fsSL -o build/old.apk https://github.com/markbang/taildeck-ui/releases/download/v0.2.18/taildeck-android-x64-v0.2.18.apk || true;
            CONTROL_URL="$CONTROL_URL" AUTH_KEY="$AUTH_KEY" PEER="$PEER" tool/terminal_sheet_record.sh build/termtap.apk top.bangwu.taildeck sheet build/old.apk || true;
            exit $status'
      - name: Job summary
        if: always()
        run: |
          {
            echo "### Terminal tap: no IME on tap, keyboard button, mouse reports"
            echo
            echo '```'
            cat termtap/summary.txt 2>/dev/null || echo 'no summary'
            echo '```'
            echo
            if [ -s sheet/summary.txt ]; then
              echo "### Terminal sheet: before and after"
              echo
              echo '```'
              cat sheet/summary.txt
              echo '```'
              echo
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: termtap
          path: |
            termtap/
            sheet/
          if-no-files-found: warn
