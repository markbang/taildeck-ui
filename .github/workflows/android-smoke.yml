# The one emulator gate. Every on-device check — cold start, back key, ping,
# node page, splash, tabs, Agents, settings stills, the terminal sheet's tap and
# IME, 20 startup-routing cold starts and 20 tailnet-ready cold starts per page —
# runs against a single emulator boot, one after the other, each with its own
# timeout and its own failure annotation (tool/android_gate_all.sh).
#
# The release workflow calls this with the shipped APK (ship mode: the cold
# start, splash, Agents and stills gates on that APK). A pull request runs the
# full set on a profile and a demo debug build made from the pull request.
name: android-smoke

on:
  pull_request:
    paths:
      - lib/**
      - native/**
      - tool/**
      - android/**
      - pubspec.yaml
      - .github/workflows/android-smoke.yml
  workflow_call:
    inputs:
      build:
        description: Build a release-signed x86_64 APK from this ref instead of downloading one
        type: boolean
        default: false
      apk-url:
        description: APK to download and smoke (ship mode)
        type: string
        default: ''
      apk-artifact:
        description: Artifact holding a taildeck-android-x64-*.apk (ship mode)
        type: string
        default: android
      apk-run-id:
        description: Run that holds the artifact (empty for the caller's run)
        type: string
        default: ''
      application-id:
        description: Package to install, launch and watch
        type: string
        default: top.bangwu.taildeck
      full-gate:
        description: Run the routing, termtap and netready gates too (needs the signed-in test control plane)
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      full-gate:
        description: Run the routing, termtap and netready gates too
        type: boolean
        default: true
      build:
        description: Build a release-signed x86_64 APK from this ref
        type: boolean
        default: false
      apk-url:
        description: APK to download (when no artifact is given)
        type: string
        default: https://github.com/markbang/taildeck-ui/releases/download/v0.2.8/taildeck-android-x64-v0.2.8.apk
      apk-artifact:
        description: Artifact holding the x86_64 APK (skips apk-url)
        type: string
        default: ''
      apk-run-id:
        description: Run whose 'android' artifact holds the x86_64 APK (empty for this run)
        type: string
        default: ''
      application-id:
        description: Package to install, launch and watch
        type: string
        default: top.bangwu.taildeck

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOPROXY: https://proxy.golang.org,direct
  GOTOOLCHAIN: auto
  APP_ID: ${{ inputs.application-id || 'top.bangwu.taildeck' }}
  KOTLIN_APK_URL: https://github.com/markbang/taildeck/releases/download/v0.1.0/taildeck-0.1.0-x86_64.apk
  AVD_NAME: taildeck-api34
  # The emulator runner creates the AVD under ANDROID_AVD_HOME when it is set;
  # pinning it is what lets the cache find the AVD and its boot snapshot again.
  ANDROID_AVD_HOME: /home/runner/.android/avd

jobs:
  smoke:
    name: one emulator, every on-device gate
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4

      - name: Pick the gates and what to build
        id: mode
        env:
          FULL_INPUT: ${{ inputs.full-gate }}
        run: |
          full=${FULL_INPUT:-false}
          # A pull request always runs the whole set; the release call and a
          # ship-mode dispatch smoke the APK they were given.
          case "${{ github.event_name }}" in
            pull_request) full=true ;;
          esac
          source=false
          if [ "$full" = true ] || [ "${{ inputs.build }}" = true ]; then source=true; fi
          if [ -z "${{ inputs.apk-artifact }}" ] && [ -z "${{ inputs.apk-url }}" ]; then source=true; fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "source=$source" >> "$GITHUB_OUTPUT"
          echo "full gates: $full, build from source: $source"

      - uses: actions/setup-java@v4
        if: steps.mode.outputs.source == 'true'
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-go@v6
        if: steps.mode.outputs.source == 'true'
        with:
          go-version: 1.27.x
          cache-dependency-path: native/bridge/go.sum
      - uses: mlugg/setup-zig@v2
        if: steps.mode.outputs.source == 'true'
        with:
          version: 0.17.1
      - name: Pin the Android NDK
        if: steps.mode.outputs.source == 'true'
        run: |
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          ndk="$sdk/ndk/28.2.13676358"
          if [ ! -d "$ndk" ]; then
            sdkmanager_bin="$(ls "$sdk"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
            yes | "$sdkmanager_bin" --licenses > /dev/null 2>&1 || true
            "$sdkmanager_bin" --install "ndk;28.2.13676358"
          fi
          test -d "$ndk"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        if: steps.mode.outputs.source == 'true'
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - name: Resolve the pinned ghostty rev
        id: ghostty
        if: steps.mode.outputs.source == 'true'
        run: echo "rev=$(sed -n 's/^GHOSTTY_REV=//p' native/term/build-ghostty.sh)" >> "$GITHUB_OUTPUT"
      - name: Cache libghostty-vt
        if: steps.mode.outputs.source == 'true'
        uses: actions/cache@v4
        with:
          path: native/term/build/ghostty
          key: ghostty-vt-${{ steps.ghostty.outputs.rev }}-zig0.17.1-${{ runner.os }}-${{ runner.arch }}
      - name: Build the native libs (x86_64)
        if: steps.mode.outputs.source == 'true'
        run: |
          set -o pipefail
          flutter pub get
          tool/build_native.sh android-x86_64 | tee /tmp/build_native.log
          tool/build_term.sh android-x86_64 | tee /tmp/build_term.log
          for lib in libtaildeck_bridge.so libtaildeck_term.so; do
            test -s "android/app/src/main/jniLibs/x86_64/$lib" \
              || { echo "::error::android/app/src/main/jniLibs/x86_64/$lib missing"; exit 1; }
          done

      - name: Configure Android signing
        if: steps.mode.outputs.full != 'true' && steps.mode.outputs.source == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is empty; the smoke test needs the release keystore (see docs/SIGNING.md)"
              exit 1
            fi
          done
          umask 077
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          {
            echo "storeFile=release.jks"
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > android/key.properties
          chmod 600 android/app/release.jks android/key.properties
      - name: Build the release APK (x86_64)
        if: steps.mode.outputs.full != 'true' && steps.mode.outputs.source == 'true'
        run: |
          flutter build apk --release --target-platform android-x64 --split-per-abi
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk build/smoke.apk
          "$(ls -d "${ANDROID_SDK_ROOT:-$ANDROID_HOME}"/build-tools/*/ | sort -V | tail -1)/aapt2" \
            dump badging build/smoke.apk | head -1
      - name: Build the profile APK (x86_64)
        if: steps.mode.outputs.full == 'true'
        run: |
          flutter pub get
          # Profile is AOT-compiled like the release app but needs no keystore,
          # and its cold start is fast enough for the 20-run loops.
          flutter build apk --profile --target-platform android-x64
          cp build/app/outputs/flutter-apk/app-profile.apk build/profile.apk
          ls -l build/profile.apk
      - name: Build the debug APK for the preview gates
        if: steps.mode.outputs.full == 'true'
        run: |
          # The preview routes need the demo dataset, which a debug build only
          # carries behind TAILDECK_DEMO.
          flutter build apk --debug --target-platform android-x64 \
            --dart-define=TAILDECK_DEMO=true
          cp build/app/outputs/flutter-apk/app-debug.apk build/demo.apk
          ls -l build/demo.apk
      - name: Build the debuggable APK for the netmap-window gate
        if: steps.mode.outputs.full == 'true'
        run: |
          # The gate pushes a node key into the app's files and drops its netmap
          # cache, so this build has to stay debuggable; it carries no demo data,
          # or the demo nodes would stand in for the real netmap.
          flutter build apk --debug --target-platform android-x64
          cp build/app/outputs/flutter-apk/app-debug.apk build/netready.apk
          ls -l build/netready.apk
      - name: Drop the signing material
        if: always()
        run: rm -f android/app/release.jks android/key.properties

      - name: Download the APK
        if: ${{ steps.mode.outputs.full != 'true' && (inputs.apk-artifact || '') == '' && (inputs.apk-url || '') != '' }}
        run: |
          mkdir -p build
          curl -fsSL -o build/smoke.apk "${{ inputs.apk-url }}"
          "$(ls -d "${ANDROID_SDK_ROOT:-$ANDROID_HOME}"/build-tools/*/ | sort -V | tail -1)/aapt2" \
            dump badging build/smoke.apk | head -1
      - name: Download the APK artifact
        if: ${{ steps.mode.outputs.full != 'true' && inputs.apk-artifact }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.apk-artifact }}
          path: build/artifact
          run-id: ${{ inputs.apk-run-id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Resolve the APK under test
        run: |
          set -euo pipefail
          if [ "${{ steps.mode.outputs.full }}" = "true" ]; then
            apk=$PWD/build/profile.apk
            test -s "$apk" || { echo "::error::the profile APK was not built"; exit 1; }
            echo "APK=$apk" >> "$GITHUB_ENV"
            echo "PROFILE=$apk" >> "$GITHUB_ENV"
            echo "NODEPAGE=$PWD/build/demo.apk" >> "$GITHUB_ENV"
            echo "NETREADY_APK=$PWD/build/netready.apk" >> "$GITHUB_ENV"
          else
            apk=build/smoke.apk
            if [ ! -s "$apk" ]; then
              apk="$(ls build/artifact/taildeck-android-x64-*.apk 2>/dev/null | head -1 || true)"
            fi
            if [ -z "$apk" ] || [ ! -s "$apk" ]; then
              apk="$(ls build/artifact/*.apk 2>/dev/null | head -1 || true)"
            fi
            test -s "$apk" || { echo "::error::no APK to smoke"; exit 1; }
            echo "APK=$PWD/$apk" >> "$GITHUB_ENV"
          fi
          mkdir -p gates
          aapt2="$(ls -d "${ANDROID_SDK_ROOT:-$ANDROID_HOME}"/build-tools/*/ | sort -V | tail -1)/aapt2"
          "$aapt2" dump badging "$apk" | grep -E "^(package|application-label:|launchable-activity)" \
            | tee gates/badging.txt
          echo "smoking $apk ($(stat -c%s "$apk") bytes)"
      - name: The release APK carries no demo data
        if: steps.mode.outputs.full != 'true'
        run: tool/check_demo_free.sh "$APK"

      - name: Start the test control plane and the peers
        id: control
        if: steps.mode.outputs.full == 'true'
        run: |
          set -o pipefail
          (cd tool/motion && go build -o /tmp/motion_control ./control) 2>&1 | tee /tmp/control-build.log
          # The netmap is held for ~2 s so every cold start meets the window
          # where the node is Running with no peers yet (the netready gate).
          /tmp/motion_control -addr 127.0.0.1:8080 -hold-map 2000ms > /tmp/control.log 2>&1 &
          for _ in $(seq 1 20); do
            grep -q 'listening on' /tmp/control.log && break
            sleep 1
          done
          grep 'listening on' /tmp/control.log || { cat /tmp/control.log; exit 1; }
          derp=$(sed -n 's/.*DERP httpsrv listener: 127\.0\.0\.1:\([0-9]*\).*/\1/p' /tmp/control.log | head -1)
          echo "control_url=http://10.0.2.2:8080" >> "$GITHUB_OUTPUT"
          echo "auth_key=tskey-test" >> "$GITHUB_OUTPUT"
          echo "derp_port=$derp" >> "$GITHUB_OUTPUT"
          echo "CONTROL_URL=http://10.0.2.2:8080" >> "$GITHUB_ENV"
          echo "AUTH_KEY=tskey-test" >> "$GITHUB_ENV"
          echo "DERP_PORT=$derp" >> "$GITHUB_ENV"
      - name: Start the peers the gates open
        if: steps.mode.outputs.full == 'true'
        run: |
          set -o pipefail
          (cd tool/motion && go build -o /tmp/motion_peer ./peer) 2>&1 | tee /tmp/peer-build.log
          # bangwu is the online peer the node and Agents pages must list;
          # motionpeer serves the SSH shell the terminal gates type into.
          /tmp/motion_peer -hostname bangwu -control http://127.0.0.1:8080 \
            -key tskey-test -port 3000 -ssh-port 22 > /tmp/peer.log 2>&1 &
          /tmp/motion_peer -hostname motionpeer -control http://127.0.0.1:8080 \
            -key tskey-test -port 3000 -ssh-port 22 > /tmp/peer2.log 2>&1 &
          for _ in $(seq 1 60); do
            grep -q 'ssh shell' /tmp/peer.log && grep -q 'ssh shell' /tmp/peer2.log && break
            sleep 1
          done
          for log in /tmp/peer.log /tmp/peer2.log; do
            grep 'ssh shell' "$log" || { cat "$log"; exit 1; }
          done
      - name: Seed a node key for the app
        if: steps.mode.outputs.full == 'true'
        run: |
          # The app starts from a key already registered on the control plane,
          # so no login tap can fall back to the browser flow mid-gate.
          tool/build_native.sh linux
          dart run tool/seed_state.dart linux/lib/libtaildeck_bridge.so /tmp/seed \
            http://127.0.0.1:8080 tskey-test taildeck
          echo "SEED_STATE=/tmp/seed/tailscaled.state" >> "$GITHUB_ENV"

      - name: Install the recording tools
        run: |
          if ! command -v ffmpeg > /dev/null || ! command -v montage > /dev/null \
            || ! command -v vim > /dev/null || ! command -v htop > /dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg imagemagick fonts-dejavu-core vim htop
          fi

      # The AVD and its quickboot snapshot are cached: a restored AVD boots in
      # about a third of a cold boot. The first (miss) run boots cold, the
      # emulator writes its snapshot on `emu kill`, and the job saves it after
      # that write finishes.
      - name: Restore the AVD snapshot
        id: avd
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/avd
          key: avd-api34-google_apis-x86_64-pixel_6-v1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Stamp the emulator launch
        run: |
          mkdir -p "$HOME/.android/avd"
          date +%s > /tmp/emulator-launch

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: ${{ env.AVD_NAME }}
          force-avd-creation: false
          disable-animations: true
          emulator-boot-timeout: 900
          # -no-snapshot-save on a restored AVD: the cached snapshot is the
          # clean one, and a fresh save would carry the gates' state forward.
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none
            ${{ steps.avd.outputs.cache-hit == 'true' && '-no-snapshot-save' || '' }}
          script: bash tool/android_gate_all.sh

      - name: Wait for the emulator's snapshot write
        if: always() && steps.avd.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          for _ in $(seq 1 90); do
            pgrep -f "qemu-system-x86_64.*$AVD_NAME" > /dev/null || exit 0
            sleep 2
          done
          echo "::warning::the emulator still runs; skipping the AVD snapshot cache"
          exit 1
      - name: Save the AVD snapshot
        if: steps.avd.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.android/avd
          key: avd-api34-google_apis-x86_64-pixel_6-v1

      - name: Job summary
        if: always()
        run: |
          {
            echo "### One emulator: every on-device gate"
            echo
            echo '```'
            cat gates/gate-results.txt 2>/dev/null || echo 'no gate results'
            echo '```'
            for entry in \
              "cold start:smoke" \
              "splash and first frame:smoke-splash" \
              "Agents cold start:smoke-agents" \
              "settings stills:smoke-shots" \
              "tab switches:smoke-tabs" \
              "back key:smoke-back" \
              "ping:smoke-ping" \
              "node page:smoke-node" \
              "terminal tap and IME:termtap" \
              "startup routing (20 cold starts):routing" \
              "tailnet-ready (20 cold starts per page):netready"; do
              title=${entry%:*}
              dir=${entry##*:}
              [ -s "$dir/summary.txt" ] || continue
              echo
              echo "### $title"
              echo
              echo '```'
              cat "$dir/summary.txt"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke
          path: |
            gates/
            smoke/
            smoke-tabs/
            smoke-back/
            smoke-ping/
            smoke-splash/
            smoke-node/
            smoke-agents/
            smoke-shots/
            termtap/
            routing/
            netready/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke-apk
          path: build/*.apk
          if-no-files-found: warn
