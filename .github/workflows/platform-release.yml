name: platform-release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attach the assets to (for example v0.2.0)
        required: true

permissions:
  contents: read

concurrency:
  group: platform-release-${{ github.ref }}
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.tag || github.ref_name }}
  GOPROXY: https://proxy.golang.org,direct
  GOTOOLCHAIN: auto

jobs:
  android:
    name: android apks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.x
          cache-dependency-path: native/bridge/go.sum
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Pin the Android NDK
        run: |
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          ndk="$sdk/ndk/28.2.13676358"
          if [ ! -d "$ndk" ]; then
            sdkmanager_bin="$(ls "$sdk"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
            yes | "$sdkmanager_bin" --licenses > /dev/null 2>&1 || true
            "$sdkmanager_bin" --install "ndk;28.2.13676358"
          fi
          test -d "$ndk"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Resolve the pinned ghostty rev
        id: ghostty
        run: echo "rev=$(sed -n 's/^GHOSTTY_REV=//p' native/term/build-ghostty.sh)" >> "$GITHUB_OUTPUT"
      - name: Cache libghostty-vt
        uses: actions/cache@v4
        with:
          path: native/term/build/ghostty
          key: ghostty-vt-${{ steps.ghostty.outputs.rev }}-zig0.17.1-${{ runner.os }}-${{ runner.arch }}
      - name: Warm the Go module cache
        shell: bash
        working-directory: native/bridge
        run: |
          for attempt in 1 2 3; do
            if go mod download; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then break; fi
            echo "::warning::go mod download failed (attempt $attempt/3); retrying in 8s"
            sleep 8
          done
          echo "::error::go mod download failed after 3 attempts against $GOPROXY"
          exit 1
      - name: Build the native libs (arm64-v8a, armeabi-v7a, x86_64)
        run: |
          set -o pipefail
          tool/build_native.sh android android-armv7 android-x86_64 | tee /tmp/build_native.log
          if grep -qi skipped /tmp/build_native.log; then
            echo '::error::tool/build_native.sh skipped an Android ABI; the APK would fall back to the mock backend.'
            exit 1
          fi
          for abi in android android-armv7 android-x86_64; do
            tool/build_term.sh "$abi" | tee "/tmp/build_term_$abi.log"
            if grep -qi skipped "/tmp/build_term_$abi.log"; then
              echo "::error::tool/build_term.sh skipped $abi; the terminal would be unavailable."
              exit 1
            fi
          done
          for abi in arm64-v8a armeabi-v7a x86_64; do
            for lib in libtaildeck_bridge.so libtaildeck_term.so; do
              path="android/app/src/main/jniLibs/$abi/$lib"
              test -s "$path" || { echo "::error::$path missing"; exit 1; }
              echo "$path $(stat -c%s "$path") bytes"
            done
          done
      - name: Configure Android signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is empty; release APKs must be signed (see docs/SIGNING.md)"
              exit 1
            fi
          done
          umask 077
          # Gradle resolves storeFile from android/app/, where the app module lives.
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          chmod 600 android/app/release.jks
          if [ ! -s android/app/release.jks ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 did not decode to a keystore (see docs/SIGNING.md)"
            exit 1
          fi
          # printf keeps '$' literal in the passwords.
          {
            echo "storeFile=release.jks"
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > android/key.properties
          chmod 600 android/key.properties
          store="$(sed -n 's/^storeFile=//p' android/key.properties)"
          if [ ! -f "android/app/$store" ]; then
            echo "::error::storeFile=$store resolves to android/app/$store, which is missing; the keystore must land there"
            exit 1
          fi
      - name: Build release APKs and the AAB
        env:
          # SHA-256 of the release certificate (same key as the Kotlin app v0.1.0).
          EXPECTED_SHA256: A76AFE7FFB0787C18BE80DB3FF2D383A09E6EDCD2F67D023A48E3CE4FCABAD61
        run: |
          set -euo pipefail
          version_name="$(sed -n 's/^version: //p' pubspec.yaml)"
          version_name="${version_name%%+*}"
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          build_tools="$(ls -d "$sdk"/build-tools/*/ | sort -V | tail -1)"
          apksigner="$build_tools/apksigner"
          aapt2="$build_tools/aapt2"

          flutter build apk --release --split-per-abi
          flutter build apk --release
          flutter build appbundle --release

          out=build/app/outputs
          cp "$out/flutter-apk/app-arm64-v8a-release.apk" "build/taildeck-android-arm64-${VERSION}.apk"
          cp "$out/flutter-apk/app-armeabi-v7a-release.apk" "build/taildeck-android-armv7-${VERSION}.apk"
          cp "$out/flutter-apk/app-x86_64-release.apk" "build/taildeck-android-x64-${VERSION}.apk"
          cp "$out/flutter-apk/app-release.apk" "build/taildeck-android-universal-${VERSION}.apk"
          cp "$out/bundle/release/app-release.aab" "build/taildeck-android-${VERSION}.aab"

          # apksigner words the digest line differently across build-tools
          # versions (and may wrap the value onto the next line); take the last
          # field of the SHA-256 line and keep only hex digits.
          cert_sha256() {
            awk '
              /SHA-256 digest/ {
                v = $NF
                if (v !~ /^[0-9A-Fa-f:]+$/) { r = (getline nxt); if (r == 1) v = nxt }
                gsub(/[^0-9A-Fa-f]/, "", v)
                print toupper(v)
                exit
              }'
          }

          verify_apk() {
            local apk=$1 abi=$2 badging certs sha code listing
            "$apksigner" verify "$apk" > /dev/null
            certs="$("$apksigner" verify --print-certs "$apk" 2>&1)"
            sha="$(printf '%s\n' "$certs" | cert_sha256)"
            if [ "$sha" != "$EXPECTED_SHA256" ]; then
              echo "::error::$apk is signed by ${sha:-<unparsed>}, expected $EXPECTED_SHA256"
              echo "--- $("$apksigner" --version 2>&1)"
              printf '%s\n' "$certs"
              exit 1
            fi
            badging="$("$aapt2" dump badging "$apk")"
            badging="${badging%%$'\n'*}"
            case "$badging" in
              *"name='top.bangwu.taildeck'"*) ;;
              *) echo "::error::$apk has the wrong applicationId: $badging"; exit 1 ;;
            esac
            case "$badging" in
              *"versionName='$version_name'"*) ;;
              *) echo "::error::$apk has the wrong versionName: $badging"; exit 1 ;;
            esac
            code="$(echo "$badging" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")"
            [ "$code" -ge 26 ] || { echo "::error::$apk versionCode $code <= 25 cannot upgrade the Kotlin app"; exit 1; }
            listing="$(unzip -l "$apk")"
            if [ -n "$abi" ]; then
              case "$listing" in
                *"lib/$abi/libtaildeck_bridge.so"*) ;;
                *) echo "::error::$apk lacks lib/$abi/libtaildeck_bridge.so"; exit 1 ;;
              esac
              case "$listing" in
                *"lib/$abi/libtaildeck_term.so"*) ;;
                *) echo "::error::$apk lacks lib/$abi/libtaildeck_term.so"; exit 1 ;;
              esac
              # Flutter's ABI splits must keep each APK single-ABI.
              [ "$(echo "$listing" | grep -c 'lib/.*/libtaildeck_bridge.so')" = "1" ] \
                || { echo "::error::$apk ships more than one ABI"; exit 1; }
            fi
            echo "$(basename "$apk"): versionCode=$code signed by ${sha:0:8}..."
          }

          verify_apk "build/taildeck-android-arm64-${VERSION}.apk" arm64-v8a
          verify_apk "build/taildeck-android-armv7-${VERSION}.apk" armeabi-v7a
          verify_apk "build/taildeck-android-x64-${VERSION}.apk" x86_64
          verify_apk "build/taildeck-android-universal-${VERSION}.apk" ""

          aab="build/taildeck-android-${VERSION}.aab"
          # keytool labels the fingerprint SHA256 or SHA-256 depending on the JDK.
          aab_certs="$(keytool -printcert -jarfile "$aab" 2>&1)"
          aab_sha="$(printf '%s\n' "$aab_certs" \
            | awk '/SHA-?256:/ { sub(/^.*SHA-?256:[ \t]*/, ""); print; exit }' \
            | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          if [ "$aab_sha" != "$EXPECTED_SHA256" ]; then
            echo "::error::$aab is signed by ${aab_sha:-<unparsed>}, expected $EXPECTED_SHA256"
            printf '%s\n' "$aab_certs"
            exit 1
          fi
          aab_listing="$(unzip -l "$aab")"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            case "$aab_listing" in
              *"base/lib/$abi/libtaildeck_bridge.so"*) ;;
              *) echo "::error::$aab lacks the $abi bridge"; exit 1 ;;
            esac
            case "$aab_listing" in
              *"base/lib/$abi/libtaildeck_term.so"*) ;;
              *) echo "::error::$aab lacks the $abi terminal"; exit 1 ;;
            esac
          done
          echo "aab signed by ${aab_sha:0:8}..."
          ls -l build/taildeck-android-*
      - name: Drop the signing material
        if: always()
        run: rm -f android/app/release.jks android/key.properties
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            build/taildeck-android-*.apk
            build/taildeck-android-*.aab
          if-no-files-found: error

  linux:
    name: linux bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Install GTK and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev ninja-build clang cmake liblzma-dev
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.x
          cache-dependency-path: native/bridge/go.sum
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Resolve the pinned ghostty rev
        id: ghostty
        run: echo "rev=$(sed -n 's/^GHOSTTY_REV=//p' native/term/build-ghostty.sh)" >> "$GITHUB_OUTPUT"
      - name: Cache libghostty-vt
        uses: actions/cache@v4
        with:
          path: native/term/build/ghostty
          key: ghostty-vt-${{ steps.ghostty.outputs.rev }}-zig0.17.1-${{ runner.os }}-${{ runner.arch }}
      - name: Warm the Go module cache
        shell: bash
        working-directory: native/bridge
        run: |
          for attempt in 1 2 3; do
            if go mod download; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then break; fi
            echo "::warning::go mod download failed (attempt $attempt/3); retrying in 8s"
            sleep 8
          done
          echo "::error::go mod download failed after 3 attempts against $GOPROXY"
          exit 1
      - name: Build the native libs
        run: |
          set -o pipefail
          tool/build_native.sh linux | tee /tmp/build_native.log
          if grep -qi skipped /tmp/build_native.log; then
            echo '::error::tool/build_native.sh skipped linux; the app would fall back to the mock backend.'
            exit 1
          fi
          tool/build_term.sh linux | tee /tmp/build_term.log
          if grep -qi skipped /tmp/build_term.log; then
            echo '::error::tool/build_term.sh skipped linux; the terminal would be unavailable.'
            exit 1
          fi
          for lib in linux/lib/libtaildeck_bridge.so linux/lib/libtaildeck_term.so; do
            test -s "$lib" || { echo "::error::$lib missing"; exit 1; }
            echo "$lib $(stat -c%s "$lib") bytes"
          done
      - run: flutter build linux --release
      - name: Package the bundle
        run: |
          bundle=build/linux/x64/release/bundle
          for lib in libtaildeck_bridge.so libtaildeck_term.so; do
            test -s "$bundle/lib/$lib" || { echo "::error::$lib missing from the bundle"; exit 1; }
          done
          tar -czf "build/taildeck-linux-x64-${VERSION}.tar.gz" \
            -C build/linux/x64/release bundle
          ls -l "build/taildeck-linux-x64-${VERSION}.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: build/taildeck-linux-x64-*.tar.gz
          if-no-files-found: error

  package:
    name: ${{ matrix.name }} (unsigned)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            artifact: windows-x64
          - name: macos
            os: macos-latest
            artifact: macos
          - name: ios
            os: macos-latest
            artifact: ios
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.x
          cache-dependency-path: native/bridge/go.sum
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - uses: msys2/setup-msys2@v2
        if: matrix.name == 'windows-x64'
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc
      - name: Put mingw on PATH (windows)
        if: matrix.name == 'windows-x64'
        shell: bash
        run: echo "C:/msys64/mingw64/bin" >> "$GITHUB_PATH"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Warm the Go module cache
        shell: bash
        working-directory: native/bridge
        run: |
          for attempt in 1 2 3; do
            if go mod download; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then break; fi
            echo "::warning::go mod download failed (attempt $attempt/3); retrying in 8s"
            sleep 8
          done
          echo "::error::go mod download failed after 3 attempts against $GOPROXY"
          exit 1
      - name: Build native libs (windows)
        if: matrix.name == 'windows-x64'
        shell: bash
        run: |
          tool/build_native.sh windows
          tool/build_term.sh windows
          for lib in windows/lib/taildeck_bridge.dll windows/lib/taildeck_term.dll; do
            test -s "$lib" || { echo "::error::$lib missing, the app would run without the backend"; exit 1; }
            echo "$lib $(stat -c%s "$lib") bytes"
          done
      - name: Build native libs (macos)
        if: matrix.name == 'macos'
        run: |
          tool/build_native.sh macos
          tool/build_term.sh macos
          for lib in macos/Frameworks/libtaildeck_bridge.dylib macos/Frameworks/libtaildeck_term.dylib; do
            test -s "$lib" || { echo "::error::$lib missing, the app would run without the backend"; exit 1; }
            lipo -info "$lib"
            codesign -dv "$lib" 2>&1 | grep -q 'Signature=adhoc' \
              || { echo "::error::$lib is not ad-hoc signed; Taildeck.app cannot be signed"; exit 1; }
          done
      - name: Build native libs (ios)
        if: matrix.name == 'ios'
        run: |
          tool/build_native.sh ios
          tool/build_term.sh ios
          for lib in ios/Frameworks/libtaildeck_bridge.a ios/Frameworks/libtaildeck_term.a; do
            test -s "$lib" || { echo "::error::$lib missing, the Runner would not link the backend"; exit 1; }
            echo "$lib $(stat -f%z "$lib") bytes"
            grep -q -- "-force_load \"\$(SRCROOT)/Frameworks/$(basename "$lib")\"" \
              ios/Flutter/NativeBridge.xcconfig \
              || { echo "::error::$(basename "$lib") is not force-loaded by NativeBridge.xcconfig"; exit 1; }
          done
          for cfg in ios/Flutter/Debug.xcconfig ios/Flutter/Release.xcconfig; do
            grep -q 'NativeBridge.xcconfig' "$cfg" \
              || { echo "::error::$cfg does not include NativeBridge.xcconfig"; exit 1; }
          done

      - name: Build and zip (windows)
        if: matrix.name == 'windows-x64'
        shell: pwsh
        run: |
          flutter build windows --release
          $release = 'build/windows/x64/runner/Release'
          foreach ($lib in @('taildeck_bridge.dll', 'taildeck_term.dll')) {
            if (-not (Test-Path "$release/$lib")) { throw "error:: $lib missing from $release" }
          }
          $zip = "build/taildeck-windows-x64-$env:VERSION-unsigned.zip"
          Compress-Archive -Path "$release/*" -DestinationPath $zip
          $archive = [IO.Compression.ZipFile]::OpenRead("$PWD/$zip")
          try {
            $names = $archive.Entries | ForEach-Object { $_.FullName }
            foreach ($lib in @('taildeck_bridge.dll', 'taildeck_term.dll')) {
              if (-not ($names -contains $lib)) { throw "error:: $lib missing from the zip" }
            }
          } finally { $archive.Dispose() }
      - name: Build and zip (macos)
        if: matrix.name == 'macos'
        run: |
          flutter build macos --release
          app=build/macos/Build/Products/Release/Taildeck.app
          for lib in libtaildeck_bridge.dylib libtaildeck_term.dylib; do
            test -s "$app/Contents/Frameworks/$lib" || { echo "::error::$lib missing from $app"; exit 1; }
          done
          ditto -c -k --sequesterRsrc --keepParent "$app" \
            "build/taildeck-macos-${VERSION}-unsigned.zip"
      - name: Build and zip (ios)
        if: matrix.name == 'ios'
        run: |
          flutter build ios --release --no-codesign
          # -force_load in ios/Flutter/NativeBridge.xcconfig keeps the archives
          # in the Runner binary; Mach-O exports C symbols with a leading "_".
          runner=build/ios/iphoneos/Runner.app/Runner
          missing=0
          for sym in td_start td_term_create; do
            if nm -g "$runner" | grep -qE "[ _]${sym}\$"; then continue; fi
            echo "$sym missing from the Runner binary"
            missing=1
          done
          if [ "$missing" -ne 0 ]; then
            # Non-blocking: the unsigned package still ships, on mock data.
            echo "::warning::td_* symbols missing; the iOS app runs on mock data"
            echo "--- td_* symbols in $runner"
            nm -g "$runner" | grep -E 'td_(start|term_create)' | head -20 || true
            echo "--- ios/Flutter/NativeBridge.xcconfig"
            cat ios/Flutter/NativeBridge.xcconfig
            echo "--- archives"
            ls -l ios/Frameworks/*.a || true
          fi
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app \
            "build/taildeck-ios-${VERSION}-unsigned.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/taildeck-${{ matrix.artifact }}-${{ env.VERSION }}-unsigned.zip
          if-no-files-found: error

  release:
    name: github release
    needs: [android, linux, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check the tag exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/git/ref/tags/${VERSION}" > /dev/null || {
            echo "::error::tag ${VERSION} does not exist"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          for f in \
            "taildeck-linux-x64-${VERSION}.tar.gz" \
            "taildeck-windows-x64-${VERSION}-unsigned.zip" \
            "taildeck-macos-${VERSION}-unsigned.zip" \
            "taildeck-ios-${VERSION}-unsigned.zip"; do
            test -s "$f" || { echo "::error::$f missing"; exit 1; }
          done
          ls taildeck-android-*.apk > /dev/null 2>&1 || {
            echo "::error::no Android APK"; exit 1; }
          ls taildeck-android-*.aab > /dev/null 2>&1 || {
            echo "::error::no Android AAB"; exit 1; }
          sha256sum taildeck-* > SHA256SUMS
          cat SHA256SUMS
      - name: Compose release notes
        run: |
          cat > notes.md <<EOF
          ## Taildeck ${VERSION}

          Flutter client for Android, Linux, Windows, macOS and iOS.
          The tsnet node and the libghostty-vt terminal ship as native libraries inside every package.

          **Most phones: arm64-v8a.** Anything else is for older 32-bit devices, x86_64 emulators, or a single
          package that covers every ABI.

          | Asset | Platform | Signing |
          | --- | --- | --- |
          | \`taildeck-android-arm64-${VERSION}.apk\` | Android 8+ (arm64-v8a, most phones) | release keystore |
          | \`taildeck-android-armv7-${VERSION}.apk\` | Android 8+ (armeabi-v7a, 32-bit) | release keystore |
          | \`taildeck-android-x64-${VERSION}.apk\` | Android x86_64 (emulators) | release keystore |
          | \`taildeck-android-universal-${VERSION}.apk\` | Android 8+, every ABI in one file | release keystore |
          | \`taildeck-android-${VERSION}.aab\` | Android App Bundle (Play) | release keystore |
          | \`taildeck-linux-x64-${VERSION}.tar.gz\` | Linux x64 (extract, run \`bundle/taildeck_ui\`) | not signed |
          | \`taildeck-windows-x64-${VERSION}-unsigned.zip\` | Windows x64 | unsigned |
          | \`taildeck-macos-${VERSION}-unsigned.zip\` | macOS (universal) | unsigned |
          | \`taildeck-ios-${VERSION}-unsigned.zip\` | iOS arm64 (unsigned Runner.app) | unsigned |

          - Android packages are signed with the release keystore, the same key as the Kotlin app v0.1.0: they
            upgrade over it and keep its data. See [docs/SIGNING.md](docs/SIGNING.md).
          - Windows, macOS and iOS packages are unsigned: SmartScreen and Gatekeeper will warn, and iOS needs your
            own signing profile.
          - \`SHA256SUMS\` lists the SHA-256 of every asset.
          - Web UI preview: https://markbang.github.io/taildeck-ui/

          ## 中文

          Flutter 客户端，覆盖 Android、Linux、Windows、macOS 与 iOS。
          tsnet 节点与 libghostty-vt 终端以原生库形式打包在各平台安装包内。

          **绝大多数手机：arm64-v8a。** 其余文件面向 32 位老设备、x86_64 模拟器，或想用一个包覆盖所有架构。

          | 文件 | 平台 | 签名 |
          | --- | --- | --- |
          | \`taildeck-android-arm64-${VERSION}.apk\` | Android 8+（arm64-v8a，绝大多数手机） | 发布密钥 |
          | \`taildeck-android-armv7-${VERSION}.apk\` | Android 8+（armeabi-v7a，32 位） | 发布密钥 |
          | \`taildeck-android-x64-${VERSION}.apk\` | Android x86_64（模拟器） | 发布密钥 |
          | \`taildeck-android-universal-${VERSION}.apk\` | Android 8+，单文件包含全部架构 | 发布密钥 |
          | \`taildeck-android-${VERSION}.aab\` | Android App Bundle（Play） | 发布密钥 |
          | \`taildeck-linux-x64-${VERSION}.tar.gz\` | Linux x64（解压后运行 \`bundle/taildeck_ui\`） | 未签名 |
          | \`taildeck-windows-x64-${VERSION}-unsigned.zip\` | Windows x64 | 未签名 |
          | \`taildeck-macos-${VERSION}-unsigned.zip\` | macOS（通用） | 未签名 |
          | \`taildeck-ios-${VERSION}-unsigned.zip\` | iOS arm64（未签名 Runner.app） | 未签名 |

          - Android 安装包使用发布密钥签名，与 Kotlin 版 v0.1.0 同一密钥：可直接升级并保留其数据，见
            [docs/SIGNING.zh-CN.md](docs/SIGNING.zh-CN.md)。
          - Windows、macOS、iOS 安装包未签名：SmartScreen 与 Gatekeeper 会告警，iOS 需自备签名。
          - \`SHA256SUMS\` 包含所有文件的 SHA-256。
          - Web 界面预览：https://markbang.github.io/taildeck-ui/
          EOF
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Taildeck ${{ env.VERSION }}
          body_path: notes.md
          files: |
            dist/taildeck-*
            dist/SHA256SUMS
          fail_on_unmatched_files: true
