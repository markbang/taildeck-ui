# Agents switch gate: replays the reported recording on the KVM emulator. A
# herdr dial fails while another tab is up, then the Agents tab is tapped; the
# page must wake the target and paint the connecting skeleton, never the
# failure left by the earlier dial (not one frame), and only the dial the visit
# started may turn into an error with Retry. Clip, frames, stills and the
# frame-by-frame check go in the artifact.
name: agents-switch-record

on:
  pull_request:
    paths:
      - lib/src/pages/agents.dart
      - lib/src/agents_phase.dart
      - lib/src/backend.dart
      - lib/src/herdr.dart
      - tool/agents_switch_record.sh
      - tool/agents_switch_check.py
      - .github/workflows/agents-switch-record.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agents-switch-${{ github.ref }}
  cancel-in-progress: true

env:
  GOPROXY: https://proxy.golang.org,direct
  GOTOOLCHAIN: auto
  APP_ID: top.bangwu.taildeck

jobs:
  record:
    name: tap Agents, no stale failure
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.x
          cache-dependency-path: native/bridge/go.sum
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Pin the Android NDK
        run: |
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          ndk="$sdk/ndk/28.2.13676358"
          if [ ! -d "$ndk" ]; then
            sdkmanager_bin="$(ls "$sdk"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
            yes | "$sdkmanager_bin" --licenses > /dev/null 2>&1 || true
            "$sdkmanager_bin" --install "ndk;28.2.13676358"
          fi
          test -d "$ndk"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build the native libs (x86_64)
        run: |
          set -o pipefail
          tool/build_native.sh android-x86_64 | tee /tmp/build_native.log
          tool/build_term.sh android-x86_64 | tee /tmp/build_term.log
      - name: Configure Android signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is empty; the gate needs the release keystore (see docs/SIGNING.md)"
              exit 1
            fi
          done
          umask 077
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          {
            echo "storeFile=release.jks"
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > android/key.properties
          chmod 600 android/app/release.jks android/key.properties
      - name: Build the release APK (x86_64)
        # The shipped build, as in the recording: no demo data and no probe.
        run: |
          flutter build apk --release --target-platform android-x64 --split-per-abi
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk build/agents-switch.apk
          ls -l build/agents-switch.apk
      - name: Drop the signing material
        if: always()
        run: rm -f android/app/release.jks android/key.properties
      - name: Start the test control plane and a peer named bangwu
        id: control
        run: |
          set -o pipefail
          (cd tool/motion && go build -o /tmp/motion_control ./control && go build -o /tmp/motion_peer ./peer)
          /tmp/motion_control -addr 127.0.0.1:8080 > /tmp/control.log 2>&1 &
          for _ in $(seq 1 20); do
            grep -q 'listening on' /tmp/control.log && break
            sleep 1
          done
          grep 'listening on' /tmp/control.log || { cat /tmp/control.log; exit 1; }
          /tmp/motion_peer -hostname bangwu -control http://127.0.0.1:8080 \
            -key tskey-test -port 3000 -ssh-port 22 -hang-port 3001 > /tmp/peer.log 2>&1 &
          for _ in $(seq 1 60); do
            grep -q 'serving on' /tmp/peer.log && break
            sleep 1
          done
          grep 'serving on' /tmp/peer.log || { cat /tmp/peer.log; exit 1; }
          echo "control_url=http://10.0.2.2:8080" >> "$GITHUB_OUTPUT"
      - name: Seed a node key for the app
        run: |
          tool/build_native.sh linux
          dart run tool/seed_state.dart linux/lib/libtaildeck_bridge.so /tmp/seed \
            http://127.0.0.1:8080 tskey-test taildeck
      - name: Install the recording tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg imagemagick
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: >-
            CONTROL_URL='${{ steps.control.outputs.control_url }}'
            SEED_STATE=/tmp/seed/tailscaled.state
            HANG_PORT=3001
            bash tool/agents_switch_record.sh build/agents-switch.apk "$APP_ID" agents-switch
      - name: Job summary
        if: always()
        run: |
          {
            echo "### Agents switch gate (stale failure must not paint)"
            echo
            echo '```'
            cat agents-switch/summary.txt 2>/dev/null || echo 'no summary'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agents-switch
          path: agents-switch/
          if-no-files-found: warn
