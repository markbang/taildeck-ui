# Records a select closing on an emulator: Settings > Language and the SSH
# sheet's Authentication row, on the build before the close-animation fix and
# the build after it, plus FlClash closing its language menu. Every frame of
# each close is cut and measured, so a block left at the value's place shows up
# in the contact sheet and in the check.
name: select-record

on:
  workflow_dispatch:
  pull_request:
    paths:
      - lib/src/widgets/select_row.dart
      - lib/src/widgets/select_value_button.dart
      - third_party/prism_ui/lib/popup.dart
      - tool/select_record.sh
      - tool/select_frames.py
      - .github/workflows/select-record.yml

permissions:
  contents: read

concurrency:
  group: select-record-${{ github.ref }}
  cancel-in-progress: true

env:
  GOPROXY: https://proxy.golang.org,direct
  GOTOOLCHAIN: auto
  FLCLASH_VERSION: 0.9.3
  SELECT_SLOW: '5'

jobs:
  record:
    name: select closes, before and after, against FlClash
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.x
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Pin the Android NDK
        run: |
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          ndk="$sdk/ndk/28.2.13676358"
          if [ ! -d "$ndk" ]; then
            sdkmanager_bin="$(ls "$sdk"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
            yes | "$sdkmanager_bin" --licenses > /dev/null 2>&1 || true
            "$sdkmanager_bin" --install "ndk;28.2.13676358"
          fi
          test -d "$ndk"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - name: Build the debug APKs, after and before
        # A debug build carries the demo dataset and ?slow=, which stretches
        # the close so the clip holds every frame of it.
        run: |
          set -o pipefail
          flutter pub get
          tool/build_native.sh android-x86_64 | tee /tmp/build_native.log
          tool/build_term.sh android-x86_64 | tee /tmp/build_term.log
          flutter build apk --debug --target-platform android-x64
          cp build/app/outputs/flutter-apk/app-debug.apk build/select-after.apk
          # The same tree with the fix taken out, for the "before" clip.
          cp lib/src/widgets/select_row.dart /tmp/select_row.dart
          cp third_party/prism_ui/lib/popup.dart /tmp/popup.dart
          git show origin/main:lib/src/widgets/select_row.dart > lib/src/widgets/select_row.dart
          git show origin/main:third_party/prism_ui/lib/popup.dart > third_party/prism_ui/lib/popup.dart
          rm -f lib/src/widgets/select_value_button.dart
          flutter build apk --debug --target-platform android-x64
          cp build/app/outputs/flutter-apk/app-debug.apk build/select-before.apk
          cp /tmp/select_row.dart lib/src/widgets/select_row.dart
          cp /tmp/popup.dart third_party/prism_ui/lib/popup.dart
          git checkout -- lib/src/widgets/select_value_button.dart
          ls -l build/select-after.apk build/select-before.apk
      - name: Fetch FlClash
        run: |
          url="https://github.com/chen08209/FlClash/releases/download/v$FLCLASH_VERSION/FlClash-$FLCLASH_VERSION-android-x86_64.apk"
          curl -fL --retry 3 -o build/flclash.apk "$url"
          ls -l build/flclash.apk
      - name: Install the recording tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg imagemagick fonts-dejavu-core
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: >-
            SELECT_SLOW="$SELECT_SLOW" bash tool/select_record.sh
            build/select-after.apk build/select-before.apk build/flclash.apk
            select
      - name: Job summary
        if: always()
        run: |
          {
            echo '### Select closes, before and after'
            echo
            echo '```'
            cat select/summary.txt 2>/dev/null || echo 'no summary'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: select
          path: |
            select/
          if-no-files-found: warn
