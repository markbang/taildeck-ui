# Records each motion effect on the emulator, on this build and on the Kotlin
# reference app, and puts them side by side under docs/motion/. Manual only, so
# a recording never gates a release; a missing clip is reported, not failed.
name: motion-record

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: motion-record-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    name: motion on the emulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build a profile APK (x86_64)
        run: |
          flutter build apk --profile --target-platform android-x64
          cp build/app/outputs/flutter-apk/app-profile.apk build/motion.apk
      - name: Download the Kotlin v0.1.0 APK
        run: |
          curl -fsSL -o build/kotlin.apk \
            https://github.com/markbang/taildeck/releases/download/v0.1.0/taildeck-0.1.0-x86_64.apk
      - name: Install the recording tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          # Recordings need the animations the smoke test switches off.
          disable-animations: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tool/motion_record.sh build/motion.apk build/kotlin.apk top.bangwu.taildeck motion
      - name: Job summary
        if: always()
        run: |
          {
            echo "### Motion recordings"
            echo
            echo '```'
            cat motion/summary.txt 2>/dev/null || echo 'no summary'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: motion
          path: motion/
          if-no-files-found: warn
