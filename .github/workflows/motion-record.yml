# Records each motion effect on the emulator, on this build and on the Kotlin
# reference app, and puts them side by side under docs/motion/. Manual only, so
# a recording never gates a release; a missing clip is reported, not failed.
name: motion-record

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOPROXY: https://proxy.golang.org,direct
  GOTOOLCHAIN: auto

jobs:
  record:
    name: motion on the emulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.x
          cache-dependency-path: native/bridge/go.sum
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Pin the Android NDK
        run: |
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          ndk="$sdk/ndk/28.2.13676358"
          if [ ! -d "$ndk" ]; then
            sdkmanager_bin="$(ls "$sdk"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
            yes | "$sdkmanager_bin" --licenses > /dev/null 2>&1 || true
            "$sdkmanager_bin" --install "ndk;28.2.13676358"
          fi
          test -d "$ndk"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build the native libs (x86_64)
        run: |
          set -o pipefail
          tool/build_native.sh android-x86_64 | tee /tmp/build_native.log
          tool/build_term.sh android-x86_64 | tee /tmp/build_term.log
      - name: Build a profile APK (x86_64)
        run: |
          flutter build apk --profile --target-platform android-x64
          cp build/app/outputs/flutter-apk/app-profile.apk build/motion.apk
      - name: Download the Kotlin v0.1.0 APK
        run: |
          curl -fsSL -o build/kotlin.apk \
            https://github.com/markbang/taildeck/releases/download/v0.1.0/taildeck-0.1.0-x86_64.apk
      - name: Build a test control server
        # Both apps need a control plane to leave their login screens. Tailscale's
        # own `testcontrol` runs one, with a DERP relay, on a single port and
        # accepts any auth key; tool/motion/control adds the two knobs the
        # recording needs (every peer online, relay map on loopback). It binds
        # loopback, which the emulator reaches as 10.0.2.2:8080, and the relay
        # port is reversed into the device below, so the nodes keep a path even
        # though the emulator cannot see the runner's loopback.
        id: control
        run: |
          set -o pipefail
          (cd tool/motion && go build -o /tmp/motion_control ./control) 2>&1 | tee /tmp/control-build.log
          /tmp/motion_control -addr 127.0.0.1:8080 > /tmp/control.log 2>&1 &
          for _ in $(seq 1 20); do
            grep -q 'listening on' /tmp/control.log && break
            sleep 1
          done
          if grep -q 'listening on 127.0.0.1:8080' /tmp/control.log; then
            echo "control_url=http://10.0.2.2:8080" >> "$GITHUB_OUTPUT"
            echo "auth_key=tskey-test" >> "$GITHUB_OUTPUT"
            derp=$(sed -n 's/.*DERP httpsrv listener: 127\.0\.0\.1:\([0-9]*\).*/\1/p' /tmp/control.log | head -1)
            echo "derp_port=$derp" >> "$GITHUB_OUTPUT"
            echo "control server listening on 8080, relay on ${derp:-?}" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "control server did not listen; see /tmp/control.log" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Start a peer node
        # The node page's Ping, Scan and pull gestures need a peer that is
        # online and has a port open, which testcontrol's fake nodes are not.
        # This one joins the same tailnet and serves a page on 3000, a port both
        # apps' scan lists carry.
        id: peer
        run: |
          if [ -z "${{ steps.control.outputs.control_url }}" ]; then
            echo "peer=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set -o pipefail
          (cd tool/motion && go build -o /tmp/motion_peer ./peer) 2>&1 | tee /tmp/peer-build.log
          /tmp/motion_peer -control http://127.0.0.1:8080 -port 3000 > /tmp/peer.log 2>&1 &
          for _ in $(seq 1 60); do
            grep -q 'serving on' /tmp/peer.log && break
            sleep 1
          done
          grep 'serving on' /tmp/peer.log || echo 'peer did not come up; see /tmp/peer.log'
          echo "peer=motionpeer" >> "$GITHUB_OUTPUT"
      - name: Install the recording tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          # Recordings need the animations the smoke test switches off.
          disable-animations: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: >-
            CONTROL_URL='${{ steps.control.outputs.control_url }}'
            AUTH_KEY='${{ steps.control.outputs.auth_key }}'
            PEER='${{ steps.peer.outputs.peer }}'
            DERP_PORT='${{ steps.control.outputs.derp_port }}'
            bash tool/motion_record.sh build/motion.apk build/kotlin.apk
            top.bangwu.taildeck motion
      - name: Job summary
        if: always()
        run: |
          {
            echo "### Motion recordings"
            echo
            echo '```'
            cat motion/summary.txt 2>/dev/null || echo 'no summary'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: motion
          path: motion/
          if-no-files-found: warn
