# Startup routing gate: signs in on a test control plane, then cold starts the
# app 20 times and fails when the login page appears on any launch. Runs on the
# emulator with KVM; the clips and the contact sheet go in the artifact.
name: routing-smoke

on:
  pull_request:
    paths:
      - lib/src/app.dart
      - lib/src/backend.dart
      - lib/src/shell.dart
      - lib/src/splash.dart
      - lib/src/pages/login.dart
      - lib/src/native/storage.dart
      - lib/src/native/storage_io.dart
      - tool/routing_android.sh
      - tool/frame_check.py
      - .github/workflows/routing-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: routing-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  GOPROXY: https://proxy.golang.org,direct
  GOTOOLCHAIN: auto
  APP_ID: top.bangwu.taildeck

jobs:
  routing:
    name: 20 cold starts, no login flash
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.x
          cache-dependency-path: native/bridge/go.sum
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Pin the Android NDK
        run: |
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          ndk="$sdk/ndk/28.2.13676358"
          if [ ! -d "$ndk" ]; then
            sdkmanager_bin="$(ls "$sdk"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
            yes | "$sdkmanager_bin" --licenses > /dev/null 2>&1 || true
            "$sdkmanager_bin" --install "ndk;28.2.13676358"
          fi
          test -d "$ndk"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build the native libs (x86_64)
        run: |
          set -o pipefail
          tool/build_native.sh android-x86_64 | tee /tmp/build_native.log
          tool/build_term.sh android-x86_64 | tee /tmp/build_term.log
      - name: Build a debug APK (x86_64)
        # Debug signs itself, so this gate needs no release keystore.
        run: |
          flutter build apk --debug --target-platform android-x64
          cp build/app/outputs/flutter-apk/app-debug.apk build/routing.apk
          ls -l build/routing.apk
      - name: Build and start a test control server
        # testcontrol accepts any auth key and runs a relay on one port; the
        # app signs in once against it, and the saved key then reconnects on
        # every cold start.
        id: control
        run: |
          set -o pipefail
          (cd tool/motion && go build -o /tmp/motion_control ./control) 2>&1 | tee /tmp/control-build.log
          /tmp/motion_control -addr 127.0.0.1:8080 > /tmp/control.log 2>&1 &
          for _ in $(seq 1 20); do
            grep -q 'listening on' /tmp/control.log && break
            sleep 1
          done
          grep 'listening on' /tmp/control.log || { cat /tmp/control.log; exit 1; }
          echo "control_url=http://10.0.2.2:8080" >> "$GITHUB_OUTPUT"
          echo "auth_key=tskey-test" >> "$GITHUB_OUTPUT"
          derp=$(sed -n 's/.*DERP httpsrv listener: 127\.0\.0\.1:\([0-9]*\).*/\1/p' /tmp/control.log | head -1)
          echo "derp_port=$derp" >> "$GITHUB_OUTPUT"
      - name: Install the recording tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg imagemagick
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: >-
            CONTROL_URL='${{ steps.control.outputs.control_url }}'
            AUTH_KEY='${{ steps.control.outputs.auth_key }}'
            DERP_PORT='${{ steps.control.outputs.derp_port }}'
            bash tool/routing_android.sh build/routing.apk "$APP_ID" routing-smoke
      - name: Job summary
        if: always()
        run: |
          {
            echo "### Startup routing (20 cold starts)"
            echo
            echo '```'
            cat routing-smoke/summary.txt 2>/dev/null || echo 'no summary'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: routing-smoke
          path: routing-smoke/
          if-no-files-found: warn
