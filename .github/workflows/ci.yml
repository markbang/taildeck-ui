name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web build and screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter build web --release --base-href /taildeck-ui/ --no-web-resources-cdn
      - name: Serve build/web at /taildeck-ui/
        run: |
          # The build uses --base-href /taildeck-ui/, so serve it under that path.
          mkdir -p /tmp/serve
          ln -s "$PWD/build/web" /tmp/serve/taildeck-ui
          nohup python3 -m http.server 8099 --directory /tmp/serve > /tmp/http.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8099/taildeck-ui/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/http.log
          exit 1
      - name: Screenshot with headless Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          bash tool/shots.sh shots http://127.0.0.1:8099/taildeck-ui/
      - name: Job summary
        if: always()
        run: |
          {
            echo "### Web screenshots"
            echo
            echo '| file | bytes |'
            echo '| --- | --- |'
            for f in shots/*.png; do
              [ -e "$f" ] && echo "| \`$f\` | $(stat -c%s "$f") |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-screenshots
          path: shots/
          if-no-files-found: warn

  android:
    name: android debug apk
    runs-on: ubuntu-latest
    env:
      GOPROXY: https://proxy.golang.org,direct
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.x
          cache-dependency-path: native/bridge/go.sum
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Pin the Android NDK
        run: |
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          ndk="$sdk/ndk/28.2.13676358"
          if [ ! -d "$ndk" ]; then
            sdkmanager_bin="$(ls "$sdk"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
            yes | "$sdkmanager_bin" --licenses > /dev/null 2>&1 || true
            "$sdkmanager_bin" --install "ndk;28.2.13676358"
          fi
          test -d "$ndk"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Resolve the pinned ghostty rev
        id: ghostty
        run: echo "rev=$(sed -n 's/^GHOSTTY_REV=//p' native/term/build-ghostty.sh)" >> "$GITHUB_OUTPUT"
      - name: Cache libghostty-vt
        uses: actions/cache@v4
        with:
          path: native/term/build/ghostty
          key: ghostty-vt-${{ steps.ghostty.outputs.rev }}-zig0.17.1-${{ runner.os }}-${{ runner.arch }}
      - name: Build the Go tsnet bridge
        run: |
          set -o pipefail
          tool/build_native.sh android android-armv7 | tee /tmp/build_native.log
          if grep -qi skipped /tmp/build_native.log; then
            echo '::error::tool/build_native.sh skipped a target; the APK would fall back to the mock backend.'
            exit 1
          fi
      - name: Build the libghostty-vt shim
        run: |
          set -o pipefail
          tool/build_term.sh android android-armv7 | tee /tmp/build_term.log
          if grep -qi skipped /tmp/build_term.log; then
            echo '::error::tool/build_term.sh skipped android; the terminal would be unavailable.'
            exit 1
          fi
      - name: Check the native libs
        run: |
          for abi in arm64-v8a armeabi-v7a; do
            for lib in libtaildeck_bridge.so libtaildeck_term.so; do
              path="android/app/src/main/jniLibs/$abi/$lib"
              test -s "$path" || { echo "::error::$path missing"; exit 1; }
              echo "$path $(stat -c%s "$path") bytes"
            done
          done
      - run: flutter build apk --debug --target-platform android-arm64
      - name: Check the APK ships the native libs
        run: |
          unzip -l build/app/outputs/flutter-apk/app-debug.apk | tee /tmp/apk.log
          for lib in libtaildeck_bridge.so libtaildeck_term.so; do
            grep -q "lib/arm64-v8a/$lib" /tmp/apk.log || { echo "::error::$lib not in the APK"; exit 1; }
          done
      - name: A release build without a keystore fails
        run: |
          if flutter build apk --release > /tmp/release.log 2>&1; then
            echo '::error::the release build must refuse to run without android/key.properties'
            exit 1
          fi
          grep -q 'android/key.properties' /tmp/release.log \
            || { tail -20 /tmp/release.log; echo '::error::the failure does not mention android/key.properties'; exit 1; }
          echo "unsigned release build refused, as expected"
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  linux:
    name: linux build and screenshot
    runs-on: ubuntu-latest
    env:
      GOPROXY: https://proxy.golang.org,direct
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK and X dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev ninja-build clang cmake xvfb imagemagick liblzma-dev
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.x
          cache-dependency-path: native/bridge/go.sum
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Resolve the pinned ghostty rev
        id: ghostty
        run: echo "rev=$(sed -n 's/^GHOSTTY_REV=//p' native/term/build-ghostty.sh)" >> "$GITHUB_OUTPUT"
      - name: Cache libghostty-vt
        uses: actions/cache@v4
        with:
          path: native/term/build/ghostty
          key: ghostty-vt-${{ steps.ghostty.outputs.rev }}-zig0.17.1-${{ runner.os }}-${{ runner.arch }}
      - name: Build the Go tsnet bridge
        run: |
          set -o pipefail
          tool/build_native.sh linux | tee /tmp/build_native.log
          if grep -qi skipped /tmp/build_native.log; then
            echo '::error::tool/build_native.sh skipped linux; the app would fall back to the mock backend.'
            exit 1
          fi
      - name: Build the libghostty-vt shim
        run: |
          set -o pipefail
          tool/build_term.sh linux | tee /tmp/build_term.log
          if grep -qi skipped /tmp/build_term.log; then
            echo '::error::tool/build_term.sh skipped linux; the terminal would be unavailable.'
            exit 1
          fi
      - name: Check the native libs
        run: |
          for lib in linux/lib/libtaildeck_bridge.so linux/lib/libtaildeck_term.so; do
            test -s "$lib" || { echo "::error::$lib missing"; exit 1; }
            echo "$lib $(stat -c%s "$lib") bytes"
          done
      - run: flutter build linux --release
      - name: Check the bundle ships the native libs
        run: |
          for lib in libtaildeck_bridge.so libtaildeck_term.so; do
            bin="build/linux/x64/release/bundle/lib/$lib"
            test -s "$bin" || { echo "::error::$bin missing from the bundle"; exit 1; }
            echo "$bin $(stat -c%s "$bin") bytes"
          done
      - name: Run the bundle on Xvfb and screenshot
        run: |
          mkdir -p shots
          xvfb-run -a --server-args="-screen 0 1440x900x24" bash -c '
            set -e
            ./build/linux/x64/release/bundle/taildeck_ui &
            app=$!
            sleep 12
            import -window root shots/linux.png
            kill "$app" || true
          '
      - uses: actions/upload-artifact@v4
        with:
          name: linux-screenshot
          path: shots/linux.png
          if-no-files-found: error
