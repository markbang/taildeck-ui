# Records snippets, sessions, reconnect and the terminal's appearance on the
# emulator, against a real SSH shell carried by the test tailnet: the runner
# starts a control plane and two peer nodes, and tool/motion/peer serves SSH on
# port 22. Manual only; a missing clip is reported, not failed.
name: termsessions-record

on:
  workflow_dispatch:
  # Temporary: dispatch only reaches a workflow that is on the default branch.
  push:
    branches: [feat/terminal-sessions]

permissions:
  contents: read

concurrency:
  group: termsessions-record-${{ github.ref }}
  cancel-in-progress: true

env:
  GOPROXY: https://proxy.golang.org,direct
  GOTOOLCHAIN: auto

jobs:
  record:
    name: snippets, sessions and appearance on the emulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.x
          cache-dependency-path: native/bridge/go.sum
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Pin the Android NDK
        run: |
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          ndk="$sdk/ndk/28.2.13676358"
          if [ ! -d "$ndk" ]; then
            sdkmanager_bin="$(ls "$sdk"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
            yes | "$sdkmanager_bin" --licenses > /dev/null 2>&1 || true
            "$sdkmanager_bin" --install "ndk;28.2.13676358"
          fi
          test -d "$ndk"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build the native libs (x86_64)
        run: |
          set -o pipefail
          tool/build_native.sh android-x86_64 | tee /tmp/build_native.log
          tool/build_term.sh android-x86_64 | tee /tmp/build_term.log
      - name: Build a profile APK (x86_64)
        run: |
          flutter build apk --profile --target-platform android-x64
          cp build/app/outputs/flutter-apk/app-profile.apk build/termsessions.apk
      - name: Start a test control plane
        id: control
        run: |
          set -o pipefail
          (cd tool/motion && go build -o /tmp/motion_control ./control) 2>&1 | tee /tmp/control-build.log
          /tmp/motion_control -addr 127.0.0.1:8080 > /tmp/control.log 2>&1 &
          for _ in $(seq 1 20); do
            grep -q 'listening on' /tmp/control.log && break
            sleep 1
          done
          if grep -q 'listening on 127.0.0.1:8080' /tmp/control.log; then
            echo "control_url=http://10.0.2.2:8080" >> "$GITHUB_OUTPUT"
            echo "auth_key=tskey-test" >> "$GITHUB_OUTPUT"
            derp=$(sed -n 's/.*DERP httpsrv listener: 127\.0\.0\.1:\([0-9]*\).*/\1/p' /tmp/control.log | head -1)
            echo "derp_port=$derp" >> "$GITHUB_OUTPUT"
          else
            echo "control server did not listen; see /tmp/control.log" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Start two peers with an SSH shell
        # Two nodes, so the session strip has something to switch between; each
        # serves bash on a pty and exposes a loopback /drop the script calls to
        # make a session drop.
        id: peers
        run: |
          if [ -z "${{ steps.control.outputs.control_url }}" ]; then
            echo "peers=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set -o pipefail
          (cd tool/motion && go build -o /tmp/motion_peer ./peer) 2>&1 | tee /tmp/peer-build.log
          /tmp/motion_peer -control http://127.0.0.1:8080 -hostname motionpeer -port 3000 -ssh-port 22 -drop-addr 127.0.0.1:3999 > /tmp/peer1.log 2>&1 &
          /tmp/motion_peer -control http://127.0.0.1:8080 -hostname motionpeer2 -port 3001 -ssh-port 22 -drop-addr 127.0.0.1:3998 > /tmp/peer2.log 2>&1 &
          for _ in $(seq 1 60); do
            grep -q 'serving on' /tmp/peer1.log && grep -q 'serving on' /tmp/peer2.log && break
            sleep 1
          done
          grep -h 'ssh shell' /tmp/peer1.log /tmp/peer2.log || echo 'a peer did not come up; see peer logs'
      - name: Install the recording tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core vim htop
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: >-
            CONTROL_URL='${{ steps.control.outputs.control_url }}'
            AUTH_KEY='${{ steps.control.outputs.auth_key }}'
            DERP_PORT='${{ steps.control.outputs.derp_port }}'
            bash -c 'adb reverse "tcp:$DERP_PORT" "tcp:$DERP_PORT" >/dev/null 2>&1 || true;
            tool/termsessions_record.sh build/termsessions.apk top.bangwu.taildeck termsessions'
      - name: Job summary
        if: always()
        run: |
          {
            echo "### Terminal sessions, snippets and appearance"
            echo
            echo '```'
            cat termsessions/summary.txt 2>/dev/null || echo 'no summary'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: termsessions
          path: termsessions/
          if-no-files-found: warn
