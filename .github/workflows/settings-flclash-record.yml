# Records the settings select and the subpage transition on one emulator,
# Taildeck next to FlClash doing the same gestures, and checks Taildeck's own
# steps: the language menu opens and lists its choices, the theme page slides
# in, back and a drag back return to the list, and nothing throws.
name: settings-flclash-record

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - lib/src/pages/settings.dart
      - lib/src/pages/theme_page.dart
      - lib/src/pages/logs.dart
      - lib/src/widgets/select_row.dart
      - lib/src/widgets/theme_preview.dart
      - lib/src/widgets/foundation.dart
      - tool/settings_flclash_record.sh
      - .github/workflows/settings-flclash-record.yml

permissions:
  contents: read

concurrency:
  group: settings-flclash-record-${{ github.ref }}
  cancel-in-progress: true

env:
  GOPROXY: https://proxy.golang.org,direct
  GOTOOLCHAIN: auto
  FLCLASH_VERSION: 0.9.3
  SLOW: '5'

jobs:
  record:
    name: selects and page transitions, Taildeck against FlClash
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.x
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Pin the Android NDK
        run: |
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          ndk="$sdk/ndk/28.2.13676358"
          if [ ! -d "$ndk" ]; then
            sdkmanager_bin="$(ls "$sdk"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
            yes | "$sdkmanager_bin" --licenses > /dev/null 2>&1 || true
            "$sdkmanager_bin" --install "ndk;28.2.13676358"
          fi
          test -d "$ndk"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - name: Build the debug APK
        # A debug build carries the demo dataset and ?slow=, which stretches
        # the menu unfold and the page push so the clip shows their frames.
        run: |
          set -o pipefail
          flutter pub get
          tool/build_native.sh android-x86_64 | tee /tmp/build_native.log
          tool/build_term.sh android-x86_64 | tee /tmp/build_term.log
          flutter build apk --debug --target-platform android-x64
          cp build/app/outputs/flutter-apk/app-debug.apk build/settings.apk
          ls -l build/settings.apk
      - name: Fetch FlClash
        run: |
          url="https://github.com/chen08209/FlClash/releases/download/v$FLCLASH_VERSION/FlClash-$FLCLASH_VERSION-android-x86_64.apk"
          curl -fL --retry 3 -o build/flclash.apk "$url"
          ls -l build/flclash.apk
      - name: Install the recording tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg imagemagick fonts-dejavu-core
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: >-
            SETTINGS_SLOW="$SLOW" bash tool/settings_flclash_record.sh
            build/settings.apk build/flclash.apk settings-flclash
      - name: Job summary
        if: always()
        run: |
          {
            echo '### Settings selects and page transitions'
            echo
            echo '```'
            cat settings-flclash/summary.txt 2>/dev/null || echo 'no summary'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: settings-flclash
          path: |
            settings-flclash/
          if-no-files-found: warn
