# Records the terminal's gesture and keyboard layer on the emulator: swipe
# arrows, a held arrow key, pinch zoom, selection with copy and open-link,
# paste, the soft keyboard resize, landscape and hardware keys. Manual only; a
# missing clip is reported, not failed.
name: termgestures-record

on:
  workflow_dispatch:
  # Temporary: dispatch only reaches a workflow that is on the default branch.
  push:
    branches: [feat/terminal-gestures]

permissions:
  contents: read

concurrency:
  group: termgestures-record-${{ github.ref }}
  cancel-in-progress: true

env:
  GOPROXY: https://proxy.golang.org,direct
  GOTOOLCHAIN: auto

jobs:
  record:
    name: grid gestures on the emulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.x
          cache-dependency-path: native/bridge/go.sum
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Pin the Android NDK
        run: |
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          ndk="$sdk/ndk/28.2.13676358"
          if [ ! -d "$ndk" ]; then
            sdkmanager_bin="$(ls "$sdk"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
            yes | "$sdkmanager_bin" --licenses > /dev/null 2>&1 || true
            "$sdkmanager_bin" --install "ndk;28.2.13676358"
          fi
          test -d "$ndk"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build the native libs (x86_64)
        run: |
          set -o pipefail
          tool/build_native.sh android-x86_64 | tee /tmp/build_native.log
          tool/build_term.sh android-x86_64 | tee /tmp/build_term.log
      - name: Build a profile APK (x86_64)
        run: |
          flutter build apk --profile --target-platform android-x64
          cp build/app/outputs/flutter-apk/app-profile.apk build/termgestures.apk
      - name: Install the recording tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tool/termgestures_record.sh build/termgestures.apk top.bangwu.taildeck termgestures
      - name: Job summary
        if: always()
        run: |
          {
            echo "### Terminal gestures"
            echo
            echo '```'
            cat termgestures/summary.txt 2>/dev/null || echo 'no summary'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: termgestures
          path: termgestures/
          if-no-files-found: warn
