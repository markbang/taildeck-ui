name: taildeck_ui
description: "Taildeck redesign, built with prism_ui."
publish_to: 'none'
version: 0.2.5+6

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  path_provider: ^2.1.6
  prism_ui:
    path: third_party/prism_ui
  url_launcher: ^6.3.3
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: false
  assets:
    - assets/fonts/
  fonts:
    - family: DejaVuSansMono
      fonts:
        - asset: assets/fonts/DejaVuSansMono.ttf
        - asset: assets/fonts/DejaVuSansMono-Bold.ttf
          weight: 700
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
    - family: NotoSansCJK
      fonts:
        - asset: assets/fonts/NotoSansCJK-subset.otf
